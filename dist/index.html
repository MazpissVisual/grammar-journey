<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Learn English grammar step by step: 56 short lessons and 1,100+ varied practice questions. Works offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Grammar Journey" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Grammar Journey" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grammar Journey" />
    <meta property="og:description" content="Learn English grammar step by step: 56 short lessons and 1,100+ varied practice questions." />
    <meta property="og:image" content="assets/icons/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Grammar Journey</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
        <symbol id="i-learn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></symbol>
        <symbol id="i-practice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
        <symbol id="i-review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
        <symbol id="i-progress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-8"/><path d="M12 20V5"/><path d="M19 20v-11"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></symbol>
        <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"/><path d="M17 7h3"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
        <symbol id="i-mixed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></symbol>
        <symbol id="i-choice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
        <symbol id="i-blank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h5"/><path d="M16 8h5"/><rect x="9.5" y="5" width="5" height="6" rx="1" stroke-dasharray="2 2"/><path d="M3 17h18"/></symbol>
        <symbol id="i-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01"/><path d="M7 14h10"/></symbol>
        <symbol id="i-order" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l4 4-4 4"/><path d="M20 7H9a4 4 0 0 0-4 4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h11a4 4 0 0 0 4-4"/></symbol>
        <symbol id="i-judge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4 2.5 4H5"/></symbol>
      </defs>
    </svg>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <button class="brand" data-view="dashboard" aria-label="Grammar Journey home">
          <span class="brand-mark">G<span>J</span></span>
          <span class="brand-copy"><strong>Grammar Journey</strong><small>Build your global voice.</small></span>
        </button>

        <nav class="nav-list">
          <button class="nav-item active" data-view="dashboard"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button>
          <button class="nav-item" data-view="learn"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-learn"/></svg><span>Learn</span></button>
          <button class="nav-item" data-view="practice"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-practice"/></svg><span>Practice</span></button>
          <button class="nav-item" data-view="review"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-review"/></svg><span>Review</span><span class="nav-badge" id="reviewBadge">0</span></button>
          <button class="nav-item" data-view="progress"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-progress"/></svg><span>Progress</span></button>
        </nav>

        <div class="sidebar-card">
          <span class="eyebrow">CURRENT PATH</span>
          <strong>Book 1 · Foundation</strong>
          <div class="mini-progress"><span id="sideProgress"></span></div>
          <small id="sideProgressText">0 of 56 lessons</small>
        </div>

        <button class="profile-card" id="profileButton" aria-label="Open settings">
          <span class="avatar">HI</span>
          <span><strong>Havidz</strong><small>Settings</small></span>
          <span class="profile-more"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></span>
        </button>
      </aside>

      <main class="main-content">
        <header class="mobile-header">
          <button class="brand compact" data-view="dashboard"><span class="brand-mark">G<span>J</span></span><strong>Grammar Journey</strong></button>
          <button class="icon-button" id="mobileProfile" aria-label="Open settings">HI</button>
        </header>
        <div id="app" class="view-container" aria-live="polite"></div>
      </main>

      <nav class="bottom-nav" aria-label="Mobile navigation">
        <button class="nav-item active" data-view="dashboard"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button>
        <button class="nav-item" data-view="learn"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-learn"/></svg><span>Learn</span></button>
        <button class="nav-item" data-view="practice"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-practice"/></svg><span>Practice</span></button>
        <button class="nav-item" data-view="review"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-review"/></svg><span>Review</span></button>
        <button class="nav-item" data-view="progress"><svg class="icon nav-icon" aria-hidden="true"><use href="#i-progress"/></svg><span>Progress</span></button>
      </nav>
    </div>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog">
        <div class="dialog-head"><div><span class="eyebrow">PERSONAL SETTINGS</span><h2>Your learning space</h2></div><button class="close-button" value="cancel" aria-label="Close">×</button></div>
        <label>Display name<input id="nameInput" maxlength="24" value="Havidz" /></label>
        <label>Daily lesson goal<select id="goalInput"><option value="1">1 lesson</option><option value="2">2 lessons</option><option value="3">3 lessons</option></select></label>
        <label>Beginner Assist<select id="beginnerInput"><option value="true">On — tampilkan bantuan Indonesia</option><option value="false">Off — English only</option></select></label>
        <div class="dialog-actions"><button class="button ghost" type="button" id="resetButton">Reset progress</button><button class="button primary" value="save" id="saveSettings">Save changes</button></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status"></div>
    <script src="js/modules.js"></script>
    <script src="content/01-parts-of-speech.js"></script>
    <script src="content/02-nouns.js"></script>
    <script src="content/03-pronouns.js"></script>
    <script src="content/04-verbs.js"></script>
    <script src="content/05-adjectives.js"></script>
    <script src="content/06-adverbs.js"></script>
    <script src="content/07-prepositions.js"></script>
    <script src="content/08-conjunctions.js"></script>
    <script src="content/09-countable.js"></script>
    <script src="content/10-gender.js"></script>
    <script src="content/11-number.js"></script>
    <script src="js/app.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/practice.js"></script>
  </body>
</html>
